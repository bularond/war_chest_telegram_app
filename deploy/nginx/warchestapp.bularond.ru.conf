# nginx in front of the container. The server serves the client itself, so
# there is nothing to route: everything goes to one origin, and the only reason
# nginx is here is TLS — Telegram will not open a Mini App over plain HTTP.
#
#   sudo cp deploy/nginx/warchestapp.bularond.ru.conf \
#           /etc/nginx/sites-available/warchestapp.bularond.ru
#   sudo ln -s /etc/nginx/sites-available/warchestapp.bularond.ru \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# The handshake header a WebSocket needs, and nothing else on a plain request.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name warchestapp.bularond.ru;

    # Leave this reachable over HTTP: it is how the certificate gets renewed.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name warchestapp.bularond.ru;

    # No http2 here on purpose. It is a property of the listening socket, not
    # of this site: if another vhost already shares 443, repeating it earns a
    # "protocol options redefined" warning, and nginx spells it two different
    # ways either side of 1.25.1 (`listen 443 ssl http2` before, `http2 on`
    # after). The game socket is HTTP/1.1 regardless — that is what an Upgrade
    # handshake is. On a server where this is the only vhost, add it whichever
    # way your nginx wants it.

    ssl_certificate     /etc/letsencrypt/live/warchestapp.bularond.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/warchestapp.bularond.ru/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # No X-Frame-Options and no frame-ancestors here: Telegram Desktop and
    # Telegram Web open a Mini App in an iframe, and a page that refuses to be
    # framed shows up as a blank window with nothing in the log to explain it.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The game socket. A player thinking over a move sends nothing, and the
    # default read timeout is 60s — without these two lines the table drops out
    # from under anyone who stops to think.
    location /ws {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
