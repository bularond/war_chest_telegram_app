# Port 80 only, to get the first certificate with.
#
# The full vhost names a certificate in its 443 block, and nginx refuses to
# start when that file is not there yet — while certbot needs a running nginx
# answering for the domain to prove you own it. This breaks the circle: put
# this in place first, take the certificate, then swap in the real config.
#
#   sudo cp deploy/nginx/warchestapp.bularond.ru.bootstrap.conf \
#           /etc/nginx/sites-available/warchestapp.bularond.ru
#   sudo ln -s /etc/nginx/sites-available/warchestapp.bularond.ru \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot certonly --webroot -w /var/www/html -d warchestapp.bularond.ru

server {
    listen 80;
    listen [::]:80;
    server_name warchestapp.bularond.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 404;
    }
}
