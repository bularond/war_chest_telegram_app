# One container, one command: `npm run deploy` (docker compose up -d --build).
#
# Values below come from the shell or from `.env` if it exists — compose reads
# that file on its own, and it is not required. Copy `.env.example` to `.env`,
# put the BotFather token in it and set NODE_ENV=production for a real
# deployment; without a token the server runs its development login instead,
# which is what makes the same command useful for a look at the thing locally.

services:
  server:
    build: .
    image: war-chest:latest
    container_name: war-chest
    restart: unless-stopped
    ports:
      # Loopback by default: behind nginx the container has no business being
      # reachable from outside, and on a VPS a published port bypasses TLS.
      # BIND=0.0.0.0 to open it up, e.g. to reach a laptop from a phone.
      - '${BIND:-127.0.0.1}:${PORT:-8787}:8787'
    environment:
      # `both` unless told otherwise: one machine doing everything, which is
      # what this file has always described. Set ROLE=app here when the chat
      # runs elsewhere — see docker-compose.chat.yml.
      ROLE: ${ROLE:-both}
      # Fixed inside the container; the host side is the port mapping above.
      PORT: 8787
      HOST: 0.0.0.0
      # Always the volume: a relative path would put the database in a layer
      # that the next build throws away.
      DB_PATH: /data/war-chest.db
      NODE_ENV: ${NODE_ENV:-development}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BOT_WORKERS: ${BOT_WORKERS:-2}
      BOT_THINK_MS: ${BOT_THINK_MS:-600}
      BOT_DEADLINE_MS: ${BOT_DEADLINE_MS:-5000}
    volumes:
      - war-chest-data:/data
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8787/health']
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  war-chest-data:
