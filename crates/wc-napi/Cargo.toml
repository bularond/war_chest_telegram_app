[package]
name = "wc-napi"
version = "0.1.0"
edition.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
wc-core = { path = "../wc-core" }
wc-bot = { path = "../wc-bot" }
napi = { version = "2", default-features = false, features = ["napi8"] }
napi-derive = "2"
serde_json = { version = "1", features = ["preserve_order"] }
rayon = "1"

[build-dependencies]
napi-build = "2"
